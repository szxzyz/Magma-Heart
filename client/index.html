    <!-- Set Telegram safe-area CSS variables immediately before React renders -->
    <script>
      (function() {
        function applyTgSafeArea() {
          var tg = window.Telegram && window.Telegram.WebApp;
          if (!tg) return;
          var st = (tg.safeAreaInset && tg.safeAreaInset.top) || 0;
          var sb = (tg.safeAreaInset && tg.safeAreaInset.bottom) || 0;
          var r = document.documentElement;
          r.style.setProperty('--tg-overlay-top', st + 'px');
          r.style.setProperty('--tg-content-safe-area-inset-top', st + 'px');
          r.style.setProperty('--tg-safe-area-inset-top', st + 'px');
          r.style.setProperty('--tg-content-safe-area-inset-bottom', sb + 'px');
          r.style.setProperty('--tg-safe-area-inset-bottom', sb + 'px');
        }

        applyTgSafeArea();

        if (window.Telegram && window.Telegram.WebApp) {
          try {

            try { _tgw.setHeaderColor('#0a0a0a'); } catch(e) {}
            try { _tgw.setBackgroundColor('#000000'); } catch(e) {}
          } catch(e) {}
          try { window.Telegram.WebApp.onEvent('safeAreaChanged', applyTgSafeArea); } catch(e) {}
          try { window.Telegram.WebApp.onEvent('viewportChanged', applyTgSafeArea); } catch(e) {}

    <script>
      (function() {
        // Block right-click and long-press context menu everywhere
        document.addEventListener('contextmenu', function(e) {
          // Allow context menu only inside input/textarea for paste
          var t = e.target;
          while (t) {
            if (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable) return;
            t = t.parentElement;
          }
          e.preventDefault();
          e.stopPropagation();
          return false;
        }, true);

        // Block image dragging
        document.addEventListener('dragstart', function(e) {
          if (e.target.tagName === 'IMG' || e.target.tagName === 'A') {
            e.preventDefault();
          }
        }, true);

        // Block long-press touchstart text selection on non-input elements
        document.addEventListener('touchstart', function(e) {
          var t = e.target;
          while (t) {
            if (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable) return;
            t = t.parentElement;
          }
        }, { passive: true });

        // Prevent default on touchend for images (stops save/share options)
        // BUT skip if the image is inside a button/link so taps still work
        document.addEventListener('touchend', function(e) {
          if (e.target.tagName !== 'IMG') return;
          var p = e.target.parentElement;
          while (p) {
            if (p.tagName === 'BUTTON' || p.tagName === 'A' || p.getAttribute('role') === 'button') return;
            p = p.parentElement;
          }
          e.preventDefault();
        }, false);
      })();
    </script>
